# TEMPORARY (2026-11-16): regenerates pnpm-lock.yaml on a CI runner because the
# local laptop runs out of memory doing it. Delete this file before opening the PR.
name: tmp-regen-lockfile

on:
  push:
    branches: [fix/security-slice1-same-major]
    paths: [".github/workflows/tmp-regen-lockfile.yml"]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - name: Regenerate lockfile only (no install scripts)
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Show resolved versions
        run: |
          grep -c "next@16.4.5" pnpm-lock.yaml || true
          grep -c "dompurify@3.4.17" pnpm-lock.yaml || true
          grep -c "better-auth@1.7.18" pnpm-lock.yaml || true
          grep -c "axios@1.20.0" pnpm-lock.yaml || true
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): regenerate pnpm-lock.yaml (CI)" || echo "no lockfile change"
          git push
