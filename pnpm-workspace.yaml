packages:
- packages/*
- apps/*

# Supply-chain hardening: block versions published <24h ago. Malicious npm releases
# are typically yanked within hours, so the cooldown blocks the attack window.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
- "@inboxzero/*"

# Dependency pins. Mirrors upstream elie222/inbox-zero's pnpm-workspace.yaml overrides
# (vetted versions that force transitive deps onto patched/compatible releases), plus
# a few of our own (marked below) for high-severity advisories that reach the prod
# runtime. Build-only / unused-feature advisories (minimatch, rollup, samlify, etc.)
# are intentionally NOT pinned — see the open Dependabot alerts for rationale.
overrides:
  # MCP SDK accepts ^2.0.5; v2 fixes the serveStatic double-decode bypass.
  # The dev-only OAuth emulator still needs ^1, so it keeps the patched 1.x.
  "@modelcontextprotocol/sdk>@hono/node-server": "2.1.6"
  "@inbox-zero/emulate>@hono/node-server": "1.19.18"
  "@tiptap/core": "2.27.2"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@xmldom/xmldom": "0.8.15"
  axios: "1.20.0"
  fast-uri: "3.1.9"          # ours: path-traversal/host-confusion (via ajv → MCP SDK / prisma)
  fast-xml-parser: "5.12.0"
  js-yaml: "3.15.2"
  jws: "4.0.1"
  kysely: "0.28.17"          # ours: JSON-path injection (via better-auth)
  linkify-it: "5.0.2"        # ahead of upstream's 5.0.1 — one advisory is only fixed in 5.0.2
  lodash: "4.18.1"
  lodash-es: "4.18.1"
  # Keep in lockstep with apps/web/package.json. This override is authoritative:
  # while it sat at 16.2.6, five separate Dependabot bumps of the manifest
  # (#91/#92/#95/#96/#97) were silently clamped back on install, so the shipped
  # app stayed on 16.2.6 with the 16.2.11 advisories open.
  #
  # Never 16.3.x: 16.3.0 had an intermittent Turbopack failure evaluating
  # postcss.config.js ("__turbopack_context__.a is not a function") that broke
  # roughly half of all builds on x64 CI and arm64 Docker. 16.4.x is allowed
  # (upstream builds on 16.4.5). Moved 16.2.11 -> 16.4.5 on 2026-11-16.
  next: "16.4.5"
  postcss: "8.5.23"
  protobufjs: "7.6.5"        # ours: proto-pollution / code-gen (via posthog + google-genai telemetry)
  svelte: "5.55.5"
  tar: "7.5.21"              # ours: 1 critical + 4 medium; critical needs >=7.5.19
  underscore: "1.13.8"       # ours: DoS in _.flatten/_.isEqual (via mammoth docx parsing)
  # ours: advisories on the 7.x line are fixed by 7.30.1 (was ">=7.0.0 <7.29.0" -> 7.29.0), which only the transitive
  # 7.x copy (via miniflare/workerd) falls into. Scoped to @7 deliberately: a flat
  # `undici: "7.29.0"` clamps apps/web's direct 8.10.0 dep DOWN a major version --
  # the same silent-clamp bug this PR fixes on `next`. Do not un-scope it.
  "undici@7": "7.30.1"
  vite: "7.3.7"
  webpack: "5.106.2"
  # 2026-11-16 security sweep, slice 1: transitive deps moved to the lowest
  # version that closes every open Trivy advisory WITHOUT leaving their major
  # (0.x: minor) line. Scoped selectors where the tree holds several majors, so
  # nothing is clamped down. Major-version fixes are a separate slice.
  "@ai-sdk/provider-utils@4": "4.0.33"
  "@babel/plugin-transform-modules-systemjs@7": "7.29.4"
  "body-parser@2": "2.4.0"
  "browserslist@>=4 <4.28.7": "4.28.7"
  "fflate@0.8": "0.8.3"
  follow-redirects: "1.16.2"
  "form-data@4": "4.0.6"
  hono: "4.13.16"
  "langsmith@0.5": "0.6.3"      # all consumers accept ">=0.5.0 <1.0.0"
  "markdown-it@14": "14.3.3"
  "mdast-util-to-hast@13": "13.2.1"
  "mysql2@3": "3.23.1"
  "nanoid@3": "3.3.18"
  "postcss-selector-parser@6": "6.1.5"
  prosemirror-view: "1.42.3"
  "qs@6": "6.16.1"
  smol-toml: "1.9.0"
  "source-map-js@1": "1.2.2"
  "uuid@11": "11.1.1"
  vue: "3.5.42"                 # optional peer (better-auth, @vercel/*); pulls matching @vue/*
  "ws@>=8 <8.21.0": "8.21.0"
  # 2026-11-16 security sweep, slice 2: fixes that cross a major line. Each
  # checked against its consumers; prefer bumping the parent where it already
  # ships the fix.
  "@microsoft/teams.apps": "2.2.1"   # via @chat-adapter/teams; 2.2 uses @azure/msal-node 7
  "@sanity/uuid": "3.0.3"            # 3.0.3 depends on uuid ^11 (was ^8)
  adm-zip: "0.6.1"                   # only consumer: @sanity/runtime-cli (CLI tooling)
  "uuid@10": "11.1.1"                # langchain/langgraph/typeid: v4/v7/parse/stringify unchanged
  # NOT overridden: glob 10/13 and minimatch 9/10 (fix needs glob 14 / minimatch 11,
  # which remove makeRe()/Minimatch#regexp that consumers may call; medium DoS
  # on crafted patterns only). @tiptap/core stays on 2.x (deliberate pin).

# pnpm 10 blocks install scripts by default. Only packages listed here may run them.
onlyBuiltDependencies:
- "@prisma/engines"
- "@sentry/cli"
- core-js
- esbuild
- msgpackr-extract
- prisma
- protobufjs
- sharp
- workerd
