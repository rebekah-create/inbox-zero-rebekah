packages:
- packages/*
- apps/*

# Supply-chain hardening: block versions published <24h ago. Malicious npm releases
# are typically yanked within hours, so the cooldown blocks the attack window.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
- "@inboxzero/*"

# Dependency pins. Mirrors upstream elie222/inbox-zero's pnpm-workspace.yaml overrides
# (vetted versions that force transitive deps onto patched/compatible releases), plus
# a few of our own (marked below) for high-severity advisories that reach the prod
# runtime. Build-only / unused-feature advisories (minimatch, rollup, samlify, etc.)
# are intentionally NOT pinned — see the open Dependabot alerts for rationale.
overrides:
  "@hono/node-server": "1.19.14"
  "@tiptap/core": "2.27.2"
  "@types/react": "19.2.14"
  "@types/react-dom": "19.2.3"
  "@xmldom/xmldom": "0.8.13"
  axios: "1.16.1"
  fast-uri: "3.1.2"          # ours: path-traversal/host-confusion (via ajv → MCP SDK / prisma)
  fast-xml-parser: "5.8.0"
  js-yaml: "3.14.2"
  jws: "4.0.1"
  kysely: "0.28.17"          # ours: JSON-path injection (via better-auth)
  linkify-it: "5.0.2"        # ahead of upstream's 5.0.1 — one advisory is only fixed in 5.0.2
  lodash: "4.18.1"
  lodash-es: "4.18.1"
  # Keep in lockstep with apps/web/package.json. This override is authoritative:
  # while it sat at 16.2.6, five separate Dependabot bumps of the manifest
  # (#91/#92/#95/#96/#97) were silently clamped back on install, so the shipped
  # app stayed on 16.2.6 with the 16.2.11 advisories open.
  #
  # Deliberately 16.2.11 and NOT upstream's 16.3.0: 16.3.0 has an intermittent
  # Turbopack failure evaluating postcss.config.js ("__turbopack_context__.a is
  # not a function"), which broke roughly half of all builds on both x64 CI and
  # arm64 Docker. 16.2.11 is the highest version any next advisory requires, so
  # this gives up nothing on security. Revisit 16.3.x once that is fixed.
  next: "16.2.11"
  postcss: "8.5.14"
  protobufjs: "7.5.6"        # ours: proto-pollution / code-gen (via posthog + google-genai telemetry)
  svelte: "5.55.5"
  tar: "7.5.21"              # ours: 1 critical + 4 medium; critical needs >=7.5.19
  underscore: "1.13.8"       # ours: DoS in _.flatten/_.isEqual (via mammoth docx parsing)
  # ours: all 6 open advisories are ">=7.0.0 <7.29.0", which only the transitive
  # 7.x copy (via miniflare/workerd) falls into. Scoped to @7 deliberately: a flat
  # `undici: "7.29.0"` clamps apps/web's direct 8.10.0 dep DOWN a major version --
  # the same silent-clamp bug this PR fixes on `next`. Do not un-scope it.
  "undici@7": "7.29.0"
  vite: "7.3.6"
  webpack: "5.106.2"

# pnpm 10 blocks install scripts by default. Only packages listed here may run them.
onlyBuiltDependencies:
- "@prisma/engines"
- "@sentry/cli"
- core-js
- esbuild
- msgpackr-extract
- prisma
- protobufjs
- sharp
- workerd
